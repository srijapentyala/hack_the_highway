<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wacky Wheels Control Tower</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --sunk: #f1f0ed; --sel: #efeee9;
    --ink: #18181b; --ink2: #3f3f46; --muted: #71717a; --faint: #a1a1aa;
    --line: #e7e5e4; --line2: #d6d3d1;
    --outage: #dc2626; --delay: #b7791f; --quality: #2563eb; --noise: #78716c; --rumor: #7c3aed;
    --ok: #15803d; --bad: #dc2626;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #0e0e10; --surface: #161618; --sunk: #1c1c1f; --sel: #1f1f23;
    --ink: #f4f4f5; --ink2: #d4d4d8; --muted: #a1a1aa; --faint: #71717a;
    --line: #26262a; --line2: #3a3a40;
    --outage: #f87171; --delay: #facc15; --quality: #60a5fa; --noise: #a8a29e; --rumor: #a78bfa;
    --ok: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hidden { display: none !important; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 9px; border: 2px solid var(--bg); }

  /* header */
  header { display: flex; align-items: center; gap: 28px; height: 56px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .brand svg { width: 20px; height: 20px; }
  .brand b { font-weight: 650; letter-spacing: -0.01em; }
  .brand span { color: var(--muted); }
  nav { display: flex; gap: 2px; height: 100%; }
  nav button { position: relative; border: 0; background: none; padding: 0 12px; height: 100%; cursor: pointer; color: var(--muted); }
  nav button:hover { color: var(--ink); }
  nav button.on { color: var(--ink); font-weight: 600; }
  nav button.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--ink); }
  .hr { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .model { font: 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .model::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 13px; color: var(--ink2); cursor: pointer; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 550; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { opacity: .88; }
  .btn svg { width: 10px; height: 10px; }
  .btn.live { background: var(--surface); color: var(--outage); border-color: var(--outage); }
  .icon { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; color: var(--ink2); }
  .icon svg { width: 16px; height: 16px; }
  .rec { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* summary bar */
  .bar { position: relative; display: flex; align-items: center; gap: 22px; padding: 0 24px; height: 40px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); flex: none; white-space: nowrap; overflow-x: auto; }
  .bar b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .bar button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
  .bar button:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .bar .right { margin-left: auto; }
  .bar .live { color: var(--outage); font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  .bar .prog { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--ink); transition: width .5s ease; }

  /* floor */
  #tower { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr); }
  .feed { border-right: 1px solid var(--line); overflow: auto; background: var(--surface); }
  .filters { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px; padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .filters button { border: 0; background: none; padding: 4px 9px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .filters button:hover { color: var(--ink); background: var(--sunk); }
  .filters button.on { color: var(--ink); background: var(--sel); font-weight: 600; }
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 13px 16px 13px 18px; cursor: pointer; position: relative; }
  .row:hover { background: var(--sunk); }
  .row.on { background: var(--sel); }
  .row.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ink); }
  .r1 { display: flex; align-items: baseline; gap: 8px; }
  .r1 b { font-weight: 650; }
  .r1 .when { margin-left: auto; font: 12px var(--mono); color: var(--faint); }
  .r2 { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink2); margin-top: 3px; }
  .r3 { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
  .row.arrive { animation: arrive .5s ease both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(-6px); } }
  .empty { padding: 28px 18px; color: var(--muted); font-size: 13px; }

  /* detail */
  #detail { overflow: auto; }
  .wrap { max-width: 960px; padding: 36px 48px 80px; }
  .eyebrow { font-size: 13px; color: var(--muted); }
  .eyebrow b { color: var(--ink); font: 600 13px var(--mono); }
  h1 { margin: 8px 0 0; font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; max-width: 30em; }
  h1.now { color: var(--ink2); font-weight: 500; }
  .tags { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--ink2); }
  .tags span { display: inline-flex; align-items: center; gap: 7px; }
  .tags .soft { color: var(--muted); }
  .ctl { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .hint { font-size: 12px; color: var(--faint); }
  kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  .rprog { flex: 1; max-width: 360px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .rprog i { display: block; height: 100%; background: var(--ink); transition: width .4s ease; }
  .rstep { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

  .sec { padding: 30px 0 4px; margin-top: 30px; border-top: 1px solid var(--line); }
  .sec.first { border-top: 0; margin-top: 26px; padding-top: 0; }
  h2 { margin: 0 0 16px; font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; gap: 12px; }
  h2 small { font-size: 12.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--faint); }
  h2 .end { margin-left: auto; }
  .two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 48px; }
  .in { animation: rise .45s ease both; }
  #pace { display: none; }
  .hero { max-width: 1120px; }
  .hero .eyebrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hero .eyebrow .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink2); padding: 3px 10px 3px 8px; border-radius: 20px; background: var(--sunk); }
  h1.big { margin: 14px 0 0; font-size: 36px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; max-width: 26em; }
  .subline { margin: 10px 0 0; font-size: 16px; color: var(--muted); }
  .herofig { margin-top: 18px; }
  .herofig .simbar { margin-bottom: 10px; }
  .simnow { display: flex; align-items: center; gap: 10px; min-height: 46px; margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
  .simnow i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .simnow b { font-weight: 700; white-space: nowrap; }
  .simnow .arr { color: var(--faint); }
  .simnow span { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .simnow em { margin-left: auto; font-style: normal; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .simnow .ok { color: var(--ok); font-weight: 700; }
  .siminspect { margin-top: 10px; }
  .bignums { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 20px; }
  .bn { padding: 14px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .bn b { display: block; font-size: 38px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .bn span { display: block; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .detrow { margin-top: 26px; }
  .details { margin-top: 8px; }
  .row .r2 span { font-size: 13.5px; color: var(--ink); }
  @media (max-width: 720px) { h1.big { font-size: 26px; } .bn b { font-size: 34px; } .simnow { font-size: 13px; } .simnow span { display: none; } }
  .simbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .simprog { flex: 1; min-width: 140px; max-width: 280px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin-left: auto; }
  .simprog i { display: block; height: 100%; width: 0; background: var(--ink); }
  .simwrap { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px 6px; }
  .simwrap svg { display: block; width: 100%; height: auto; }
  .sim-hd { font: 600 9.5px var(--sans); letter-spacing: .12em; fill: var(--faint); }
  .sim-e { fill: none; stroke: var(--line2); stroke-width: 1.6; }
  .sim-e.off { stroke-dasharray: 3 4; opacity: .45; }
  .sim-card { cursor: pointer; }
  .sc-bg { fill: var(--surface); stroke: var(--line2); stroke-width: 1.2; transition: stroke .2s, fill .2s; }
  .sim-card:hover .sc-bg { stroke: var(--ink); }
  .sim-card.on .sc-bg { stroke: var(--c); stroke-width: 2.2; fill: color-mix(in srgb, var(--c) 7%, var(--surface)); }
  .sim-card.idle { opacity: .4; }
  .sim-card.picked .sc-bg { stroke: var(--ink); stroke-width: 2.2; }
  .sc-t { font: 600 13px var(--sans); fill: var(--ink); }
  .sc-s { font: 11px var(--sans); fill: var(--muted); }
  .sc-st { font: 600 11.5px var(--sans); fill: var(--c); }
  .sc-n { font: 600 21px var(--sans); fill: var(--ink); font-variant-numeric: tabular-nums; }
  .sc-nl { font: 10px var(--sans); fill: var(--faint); }
  .sim-ico { fill: none; stroke: #059669; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sim-pk { stroke: #fff; stroke-width: 1.5; }
  .sim-badge { font: 600 12.5px var(--sans); fill: #059669; }
  .simlow { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; margin-top: 16px; }
  .simlog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 4px 14px; min-height: 120px; }
  .lrow { display: grid; grid-template-columns: 8px 128px 132px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .lrow:first-child { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  .lrow:last-of-type { border-bottom: 0; }
  .lrow i { width: 8px; height: 8px; border-radius: 50%; }
  .lrow b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow code { font: 12px var(--mono); color: var(--ink2); }
  .lrow span { font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lmore { padding: 9px 0; font-size: 12.5px; color: var(--muted); }
  .siminspect { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px 16px; font-size: 13px; line-height: 1.55; color: var(--ink2); min-height: 120px; }
  .siminspect p { margin: 6px 0 0; }
  .insrow { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .insrow code { font: 12px var(--mono); } .insrow span { font: 12px var(--mono); color: var(--muted); }
  details.trace { margin-top: 16px; }
  details.trace summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  @media (max-width: 980px) { .simlow { grid-template-columns: 1fr; } .lrow { grid-template-columns: 8px minmax(0, 1fr) auto; } .lrow code, .lrow span { display: none; } }
  .usec h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; text-transform: none; color: var(--ink); align-items: center; }
  .usec h2 .num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: inline-grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
  .usec h2 small { font-weight: 400; }
  .usec.cur { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ink); border-radius: 12px; padding: 22px 24px 18px; }
  .sub { margin: 0 0 12px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lead { margin: 0 0 12px; font-size: 16px; line-height: 1.55; font-weight: 600; color: var(--ink); max-width: 46em; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px 16px; width: 100%; font-size: 12.5px; color: var(--faint); }
  .ctl { flex-wrap: wrap; }
  .ctl.sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; margin-bottom: -6px; border-bottom: 1px solid var(--line); }
  .steps .done { color: var(--muted); } .steps .on { color: var(--ink); font-weight: 700; }
  .btn:disabled { opacity: .35; cursor: default; }
  .chainrow + .chainrow { margin-top: 22px; }
  .chainhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; font-size: 12.5px; }
  .chainhead .pill { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--ink2); }
  .chainhead code { font: 11.5px var(--mono); color: var(--ink2); }
  .chain { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px; }
  .cbox { flex: 1 1 0; min-width: 120px; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .cbox.root { border-color: var(--ink); }
  .cbox span { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .cbox b { display: block; font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .cbox em { display: block; font-style: normal; font: 11.5px var(--mono); color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carrow { display: grid; place-items: center; padding: 0 8px; color: var(--faint); font-size: 18px; flex: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink2); font-size: 13px; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
  .link:hover { color: var(--ink); text-decoration-color: var(--ink); }

  /* outcome numbers */
  .nums { display: flex; flex-wrap: wrap; gap: 14px 48px; }
  .num b { display: block; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .num span { display: block; font-size: 13px; color: var(--ink2); margin-top: 4px; }
  .num small { display: block; font-size: 12px; color: var(--faint); }

  /* message */
  .quote { margin: 0; font-size: 16.5px; line-height: 1.75; color: var(--ink); white-space: pre-wrap; }
  .tk { position: relative; border-bottom: 2px solid var(--k); cursor: help; }
  .k-plant { --k: #0891b2; } .k-part { --k: #16a34a; } .k-shipment, .k-lot { --k: #7c3aed; } .k-supplier { --k: #db2777; } .k-date { --k: #ca8a04; }
  .k-hedge { --k: var(--rumor); } .tk.k-hedge { border-bottom-style: dashed; }
  .k-off { --k: var(--faint); } .tk.k-off { border-bottom: 0; text-decoration: line-through; text-decoration-color: var(--faint); }
  .tk:hover::after { content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 6px); white-space: nowrap; z-index: 10;
    font: 500 12px var(--sans); color: var(--bg); background: var(--ink); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  sup.n { font: 700 10px var(--sans); color: var(--c); margin-right: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 2px; background: var(--k); margin-right: 6px; vertical-align: 3px; }
  .inc + .inc { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .inct { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .inct .muted { margin-left: auto; font-weight: 400; font-size: 12.5px; }
  dl { display: grid; grid-template-columns: 84px 1fr; gap: 6px 12px; margin: 10px 0 0; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: var(--mono); font-size: 12.5px; }
  dd small { font-family: var(--sans); color: var(--muted); margin-left: 6px; font-size: 12px; }
  .note { margin: 16px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .note b { color: var(--ink2); font-weight: 600; }

  /* agents */
  .agents { list-style: none; margin: 0; padding: 0; }
  .agents li { display: grid; grid-template-columns: 26px 190px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .agents li:last-child { border-bottom: 0; }
  .agents .ix { font: 12px var(--mono); color: var(--faint); padding-top: 1px; }
  .agents .who b { display: block; font-weight: 600; }
  .agents .who span { font-size: 12.5px; color: var(--muted); }
  .agents .did { font-size: 13.5px; color: var(--ink2); line-height: 1.55; }
  .agents .tools { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font: 12px var(--mono); color: var(--muted); }
  .agents .tools b { color: var(--ink); font-weight: 600; }
  .agents li.idle .who b, .agents li.idle .did { color: var(--faint); }
  .agents li.now { background: linear-gradient(90deg, var(--sel), transparent); }

  /* graph */
  .path + .path { margin-top: 30px; }
  .pathhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; font-size: 13px; }
  .pathhead b { font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  .pathhead .pat { font: 12px var(--mono); color: var(--muted); }
  .pathhead .cnt { margin-left: auto; font-size: 12.5px; color: var(--faint); }
  .fan { width: 100%; height: auto; display: block; overflow: visible; }
  .fan .ch { font: 600 9.5px var(--sans); letter-spacing: .1em; fill: var(--faint); }
  .fan .cn { font: 500 14px var(--sans); fill: var(--ink); }
  .fan .node { cursor: pointer; transition: opacity .15s; }
  .fan .node rect { fill: var(--surface); stroke: var(--line2); }
  .fan .node.root rect { stroke: var(--c); stroke-width: 1.5; }
  .fan .node:hover rect { stroke: var(--ink); }
  .fan .node text { font: 11.5px var(--mono); fill: var(--ink); }
  .fan .node .w { fill: var(--faint); font-size: 10px; }
  .fan .node.more rect { fill: none; stroke-dasharray: 3 3; }
  .fan .node.more text { fill: var(--muted); font-family: var(--sans); }
  .fan .edge { fill: none; stroke: var(--c); stroke-opacity: .3; transition: stroke-opacity .15s; }
  .fan.focus .edge { stroke-opacity: .06; }

];

  const nodeWalk = { Supplier: "d", Shipment: "d", Part: "dq", Model: "dq", Plant: "oq", Lot: "q", ProductionOrder: "doq", Vehicle: "q", CustomerOrder: "do", Dealer: "doq", Customer: "doq" };
  const title = { ProductionOrder: "Production order", CustomerOrder: "Customer order" };
  g += Object.entries(place).map(([id, [x, y]]) => `<g class="on${lit(nodeWalk[id]) ? " lit" : ""}"><rect x="${x}" y="${y}" width="${W}" height="${H}" rx="8"/><text class="ot" x="${x + 12}" y="${y + 19}">${esc((title[id] || id).toUpperCase())}</text><text class="oc" x="${x + 12}" y="${y + 40}">${(count[id] || 0).toLocaleString()}</text></g>`).join("");
  const c = { delay: "delay", outage: "outage", quality: "quality" }[state.walk];
  return `<svg class="omap${walk ? " walking" : ""}" style="--c:${c ? cv(c) : "var(--ink)"}" viewBox="0 0 1010 530" role="img" aria-label="Ontology">${g}</svg>`;
}
function renderOntology() {
  const o = state.report.ontology;
  const kt = k => k.includes("delay") ? "delay" : k.includes("outage") ? "outage" : "quality";
  document.getElementById("ontology").innerHTML = `<div class="wrap">
    <h1 class="ptitle">Ontology</h1>
    <p class="lede">One knowledge graph over the company data. A delay walks in from the shipment, an outage from the plant, and a quality hold from the lot. All three meet on the production order.</p>
    <div class="walks">${[["delay", "Supplier delay"], ["outage", "Plant outage"], ["quality", "Quality hold"]].map(([k, l]) => `<button data-walk="${k}" class="${state.walk === k ? "on" : ""}" style="--c:${cv(k)}"><i class="dot" style="--c:${cv(k)}"></i>${l} walk</button>`).join("")}</div>
    ${ontologySvg(o)}
    <section class="sec"><h2>Required graph paths</h2><div class="walkrows">${Object.entries(o.paths).map(([k, v]) => `<div><b><i class="dot" style="--c:${cv(kt(k))}"></i>${esc(k.replaceAll("_", " ").replace(/^./, m => m.toUpperCase()))}</b><code>${esc(v)}</code></div>`).join("")}</div></section>
    <section class="sec grid2">
      <div><h2>Entities</h2><div class="list">${o.entities.map(e => `<div><span>${esc(e.type)}</span><em>${e.count.toLocaleString()}</em></div>`).join("")}</div></div>
      <div><h2>Relationships</h2><div class="list">${o.relations.map(r => `<div><span>${esc(r.from)} → ${esc(r.to)} <em>${esc(r.edge)}</em><small>${esc(r.meaning)}</small></span><em>${r.count.toLocaleString()}</em></div>`).join("")}</div></div>
    </section></div>`;
  document.querySelectorAll("#ontology [data-walk]").forEach(b => b.onclick = () => { state.walk = state.walk === b.dataset.walk ? null : b.dataset.walk; renderOntology(); });
}
function auditRows() {
  const q = state.auditQuery.trim().toLowerCase();
  const rows = [];
  state.report.events.forEach(ev => ev.actions.forEach(a => rows.push({ ev, a })));
  return rows.filter(({ ev, a }) => (!state.auditTool || a.tool === state.auditTool) && (!q || `${ev.event_id} ${a.agent} ${a.tool} ${argSummary(a)}`.toLowerCase().includes(q)));
}
function renderAuditRows() {
  const rows = auditRows();
  document.getElementById("auditcount").textContent = `${rows.length.toLocaleString()} shown`;
  const body = document.getElementById("auditbody");
  body.innerHTML = rows.map(({ ev, a }, i) => `<tr><td class="f">${i + 1}</td><td><button class="link" data-jump="${ev.event_id}">${ev.event_id}</button></td><td>${esc(a.agent)}</td><td class="m">${esc(a.tool)}</td><td class="m">${esc(argSummary(a))}</td><td class="${a.ok === false ? "bad" : "ok"}">${a.ok === false ? "failed" : "ok"}</td></tr>`).join("") || `<tr><td colspan="6" class="muted" style="padding:24px">No calls match.</td></tr>`;
  body.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => selectEvent(b.dataset.jump, { view: "tower" }));
}
function renderAudit() {
  const all = [];
  state.report.events.forEach(ev => ev.actions.forEach(a => all.push(a)));
  const tools = countPairs(all.map(a => a.tool));
  document.getElementById("audit").innerHTML = `<div class="wrap">
    <h1 class="ptitle">Audit trail</h1>
    <p class="lede">${all.length.toLocaleString()} calls recorded by the enterprise server, ${all.filter(a => a.ok === false).length} failed. Every call shows which agent planned it and the arguments that passed validation.</p>
    <div class="tools-row">
      <input class="search" id="auditq" placeholder="Search event, agent, tool, or id" value="${esc(state.auditQuery)}" />
      <select id="audittool"><option value="">All tools · ${all.length}</option>${tools.map(([t, n]) => `<option value="${esc(t)}" ${state.auditTool === t ? "selected" : ""}>${esc(t)} · ${n}</option>`).join("")}</select>
      <span class="muted" id="auditcount" style="font-size:13px;margin-left:auto"></span>
    </div>
    <div class="tablewrap" style="max-height:none"><table><thead><tr><th>#</th><th>Event</th><th>Agent</th><th>Tool</th><th>Arguments</th><th>Result</th></tr></thead><tbody id="auditbody"></tbody></table></div></div>`;
  const q = document.getElementById("auditq");
  q.oninput = () => { state.auditQuery = q.value; renderAuditRows(); };
  document.getElementById("audittool").onchange = e => { state.auditTool = e.target.value; renderAuditRows(); };
  renderAuditRows();
}
function renderDesign() {
  const m = state.report.meta, events = state.report.events;
  const agreed = events.filter(e => e.llm && e.llm.agrees === true), kept = events.filter(e => e.llm && e.llm.agrees === false);
  const model = (m.model || "").split(" ")[0];
  const gates = [
    ["The wire", "One message. It may hold two incidents, a rumor, or nothing.", "tower", "E-01"],
    ["Llama reads", "The model proposes the kind, the names, and the date phrases.", "tower", "E-08"],
    ["The graph binds", "Aliases, the calendar, and exactly one shipment or lot.", "ontology", ""],
    ["Coordinator", "Dispatch the desks, stand down for noise, or escalate.", "tower", "E-02"],
    ["Specialists", "They walk the ontology and return a plan, not a tool call.", "crewpage", ""],
    ["The gateway", "Every argument is checked. Then the enterprise tools run.", "audit", ""]
  ];
  document.getElementById("design").innerHTML = `<div class="wrap">
    <h1 class="ptitle">How the tower decides</h1>
    <p class="lede">${esc(fmtLong(m.today))}. One fresh world per event. ${events.length} events, ${m.n_tool_calls} tool calls, ${m.n_failed} failures. Model: ${esc(model)} running locally, no API key.</p>
    <div class="card">
      <h2>Architecture · six gates</h2>
      <div class="gates6">${gates.map(([t, p, v, id], i) => `<button data-go="${v}" ${id ? `data-id="${id}"` : ""}><em>0${i + 1}</em><strong>${t}</strong><p>${p}</p></button>`).join("")}</div>
      <h2>Agents</h2>
      <div class="tablewrap" style="margin-top:0"><table><thead><tr><th>Agent</th><th>Job</th><th>Tools</th></tr></thead><tbody>${CREW.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.charter)}</td><td class="m">${c.owns.join(", ")}</td></tr>`).join("")}</tbody></table></div>
      <div class="grid2">
        <div><h2>Language model versus code</h2><p class="prose">Llama proposes the incident. It agreed on ${agreed.length} of ${events.length} readings. Where it did not bind, the ontology reader stayed in force and the tool arguments did not change. The model never chooses an order, a VIN, or a slot. Code owns policy, the calendar, capacity, loaner priority, and every tool argument.</p>
          <div class="chipline">${agreed.map(e => `<button data-go="tower" data-id="${e.event_id}">${e.event_id}</button>`).join("")}${kept.map(e => `<button class="k" data-go="tower" data-id="${e.event_id}">${e.event_id} reader kept</button>`).join("")}</div></div>
        <div><h2>Guardrails</h2><ul class="checks" style="margin-top:0">
          <li><span class="y">✓</span>Noise: no call at all.</li>
          <li><span class="y">✓</span>Rumor: escalate only. No order, dealer, or customer is touched.</li>
          <li><span class="y">✓</span>Check, then send. A rejected call is kept in the log and not retried.</li>
          <li><span class="y">✓</span>One board per event, so a compound message never double-books slots or loaners.</li>
          <li><span class="y">✓</span>One dealer notice per dealer, listing only that dealer’s orders.</li></ul></div>
      </div>
      <div class="grid2">
        <div><h2>Evaluation</h2><p class="prose">The plan is replayed on a private copy of the enterprise systems before anything is logged. It checks locations, capacity, notices, loaners, held lots, stopped VINs, owner contacts, escalation, and that unaffected orders did not move. The scored file is runs/run1/action_log.jsonl.</p></div>
        <div><h2>What we would improve</h2><p class="prose">A larger local model would close ${kept.map(e => e.event_id).join(", ") || "the remaining readings"} without being allowed to pick a slot. The handbook should publish the plant tie-break so every team lands the same transfer.</p></div>
      </div>
      <h2>Model cited</h2><p class="prose mono" style="font-size:13px">${esc(m.model)}</p>
    </div></div>`;
  bindGo(document.getElementById("design"));
}

/* ───────── routing ───────── */
function bindGo(root) {
  root.querySelectorAll("[data-go]").forEach(el => el.onclick = () => {
    stopShift();
    if (el.dataset.filter) state.filter = el.dataset.filter;
    if (el.dataset.id) { selectEvent(el.dataset.id, { view: el.dataset.go }); return; }
    state.view = el.dataset.go;
    if (state.view === "tower" && !state.report.events.filter(matches).some(e => e.event_id === state.selected)) state.selected = state.report.events.filter(matches)[0].event_id;
    syncNav(); showView(); render();
  });
}
function render() {
  renderHeader();
  renderFeed();
  renderDetail();
  if (state.view === "crewpage") renderCrewPage();
  if (state.view === "ontology") renderOntology();
  if (state.view === "audit") renderAudit();
  if (state.view === "design") renderDesign();
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { state.view = b.dataset.view; syncNav(); showView(); render(); });
document.getElementById("shiftbtn").onclick = () => { if (state.shift) { stopShift(); render(); } else startShift(); };
document.getElementById("pace").onchange = e => { state.pace = e.target.value; };
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("tower-theme", t); } catch (e) {}
}
try { setTheme(localStorage.getItem("tower-theme") || "light"); } catch (e) { setTheme("light"); }
document.getElementById("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
document.addEventListener("keydown", e => {
  if (!state.report || state.view !== "tower") return;
  if (e.target.closest("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const list = state.report.events.filter(matches), i = list.findIndex(x => x.event_id === state.selected);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); if (list[i + 1]) { stopShift(); selectEvent(list[i + 1].event_id); } }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); if (i > 0) { stopShift(); selectEvent(list[i - 1].event_id); } }
  else if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); if (SIM.playing) simPause(); else simStart(current(), SIM.t >= SIM.plan.end); }
});
/* Deep links: #E-03 · #E-03/play · #E-03/step/4 · #audit · #ontology · #crewpage · #design · #shift */
function applyHash() {
  const [head, a, b] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (!head || !state.report) return;
  if (head === "shift") { startShift(); return; }
  if (["tower", "crewpage", "ontology", "audit", "design"].includes(head)) { stopShift(); state.view = head; syncNav(); showView(); render(); return; }
  if (!state.report.events.some(e => e.event_id === head)) return;
  stopShift(); state.filter = "All";
  selectEvent(head, { view: "tower" });
  if (a === "play") startReplay();
  if (a === "step") { const n = beats(current()).length; state.replay = { id: head, step: Math.max(0, Math.min(n - 1, Number(b) || 0)), n, playing: false }; renderDetail(); }
}
window.addEventListener("hashchange", applyHash);
fetch("/api/report").then(r => r.json()).then(report => {
  state.report = report;
  if (!report.events.some(e => e.event_id === state.selected)) state.selected = report.events[0].event_id;
  render();
  applyHash();
}).catch(err => { document.getElementById("detail").innerHTML = `<div class="wrap"><p>Could not load the run. ${esc(err)}</p></div>`; });
</script>
</body>
